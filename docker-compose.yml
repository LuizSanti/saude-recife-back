services:
  postgres:
    image: postgres:16
    container_name: saude-recife-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saude_recife
      POSTGRES_USER: saude_user
      POSTGRES_PASSWORD: saude_pass
    ports:
      - "5432:5432"
    volumes:
      - saude_recife_data:/var/lib/postgresql/data

volumes:
  saude_recife_data: